<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Workout Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #f0f0f0;
    --muted: #6b7280;
    --abs: #D9622B;
    --bicep: #C99A3B;
    --chest: #4a9b6f;
    --shoulders: #5A7A8C;
    --legs: #8C5A7A;
    --success: #4a9b6f;
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Nav */
  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }
  nav button {
    flex: 1;
    padding: 14px 8px 18px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: color .15s;
  }
  nav button.active { color: var(--text); }
  nav button svg { width: 22px; height: 22px; }

  /* Pages */
  .page { display: none; padding: 24px 16px 16px; max-width: 480px; margin: 0 auto; }
  .page.active { display: block; }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  /* Groups */
  .group-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .group-tabs::-webkit-scrollbar { display: none; }
  .group-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .group-tab.active { color: #fff; border-color: transparent; }
  .group-tab[data-group="Abs"].active { background: var(--abs); }
  .group-tab[data-group="Bicep"].active { background: var(--bicep); }
  .group-tab[data-group="Chest"].active { background: var(--chest); }
  .group-tab[data-group="Shoulders"].active { background: var(--shoulders); }
  .group-tab[data-group="Legs"].active { background: var(--legs); }

  /* Exercise grid */
  .exercise-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .ex-btn {
    padding: 14px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    line-height: 1.3;
    transition: all .15s;
  }
  .ex-btn.selected { border-color: transparent; color: #fff; }
  .ex-btn[data-group="Abs"].selected { background: var(--abs); }
  .ex-btn[data-group="Bicep"].selected { background: var(--bicep); }
  .ex-btn[data-group="Chest"].selected { background: var(--chest); }
  .ex-btn[data-group="Shoulders"].selected { background: var(--shoulders); }
  .ex-btn[data-group="Legs"].selected { background: var(--legs); }

  /* Form fields */
  .fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    padding: 12px;
    width: 100%;
    -webkit-appearance: none;
  }
  .field input:focus { outline: none; border-color: #4a4d5a; }

  /* Optional section */
  .optional-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 16px;
    user-select: none;
  }
  .optional-toggle svg { transition: transform .2s; }
  .optional-toggle.open svg { transform: rotate(90deg); }
  .optional-fields { display: none; }
  .optional-fields.open { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  /* Submit */
  .submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius);
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--success);
    color: #fff;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Progress page */
  .progress-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-name { font-size: 14px; font-weight: 600; }
  .card-group {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    color: #fff;
    font-weight: 500;
  }
  .card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--muted); }

  /* Mini chart */
  .chart-wrap { height: 48px; position: relative; }
  canvas { width: 100% !important; height: 48px !important; }

  .indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 8px;
    font-weight: 500;
  }
  .indicator.strength { background: rgba(74,155,111,.15); color: #4a9b6f; }
  .indicator.volume { background: rgba(90,122,140,.15); color: var(--shoulders); }
  .indicator.neutral { background: rgba(107,114,128,.15); color: var(--muted); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .loading { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<!-- LOG PAGE -->
<div class="page active" id="page-log">
  <h1>Log workout</h1>
  <p class="subtitle" id="log-date"></p>

  <div class="group-tabs" id="group-tabs"></div>
  <div class="exercise-grid" id="exercise-grid"></div>

  <div class="fields">
    <div class="field-row">
      <div class="field">
        <label>Sets</label>
        <input type="number" id="sets" min="1" max="20" placeholder="3">
      </div>
      <div class="field">
        <label>Reps</label>
        <input type="number" id="reps" min="1" max="100" placeholder="10">
      </div>
      <div class="field">
        <label>Weight (lb)</label>
        <input type="number" id="weight" min="0" placeholder="45">
      </div>
    </div>
  </div>

  <div class="optional-toggle" id="optional-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
    Optional — energy, bodyweight, cardio
  </div>
  <div class="optional-fields" id="optional-fields">
    <div class="field-row">
      <div class="field">
        <label>Energy (1–10)</label>
        <input type="number" id="energy" min="1" max="10" placeholder="7">
      </div>
      <div class="field">
        <label>Body weight</label>
        <input type="number" id="bodyweight" placeholder="170">
      </div>
      <div class="field">
        <label>Cardio (min)</label>
        <input type="number" id="howlong" placeholder="20">
      </div>
    </div>
  </div>

  <button class="submit-btn" id="submit-btn" disabled>Select an exercise</button>
</div>

<!-- PROGRESS PAGE -->
<div class="page" id="page-progress">
  <div class="progress-header">
    <div>
      <h1>Progress</h1>
      <p class="subtitle">Last 6 sessions per exercise</p>
    </div>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
  </div>
  <div id="progress-content"><div class="loading">Loading...</div></div>
</div>

<!-- NAV -->
<nav>
  <button class="active" data-page="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Log
  </button>
  <button data-page="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Progress
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0iOrYvOgBQGDDjW80uB4EbHcGMy3zaaDDDJHuRizEfqj-4TD7T3tb3E-Km3QSyTnN/exec';

const EXERCISES = {
  Abs:       ['Cable Crunch', 'Hanging Leg Raise', 'Decline Sit Ups'],
  Bicep:     ['Barbell Curls', 'Incline Curls', 'Preacher Curls'],
  Chest:     ['Bench Press', 'Flat Press Machine', 'Incline Smith Machine', 'Pec Deck', 'Chest Press Machine'],
  Shoulders: ['Machine Shoulder Press', 'Cable Lateral Raise', 'Cable Rear Delt Fly'],
  Legs:      ['Leg Spreader Machine', 'Barbell Squats', 'Leg Extensions'],
};

const GROUP_COLORS = {
  Abs: '#D9622B', Bicep: '#C99A3B', Chest: '#4a9b6f',
  Shoulders: '#5A7A8C', Legs: '#8C5A7A',
};

let selectedExercise = null;
let selectedGroup = null;
let currentGroup = 'Abs';

// ---- Date subtitle ----
document.getElementById('log-date').textContent =
  new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

// ---- Build group tabs ----
const groupTabsEl = document.getElementById('group-tabs');
Object.keys(EXERCISES).forEach(grp => {
  const btn = document.createElement('button');
  btn.className = 'group-tab' + (grp === 'Abs' ? ' active' : '');
  btn.dataset.group = grp;
  btn.textContent = grp;
  btn.onclick = () => selectGroup(grp);
  groupTabsEl.appendChild(btn);
});

function selectGroup(grp) {
  currentGroup = grp;
  document.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.group === grp));
  renderExercises();
}

// ---- Build exercise grid ----
function renderExercises() {
  const grid = document.getElementById('exercise-grid');
  grid.innerHTML = '';
  EXERCISES[currentGroup].forEach(ex => {
    const btn = document.createElement('button');
    btn.className = 'ex-btn' + (ex === selectedExercise ? ' selected' : '');
    btn.dataset.group = currentGroup;
    btn.textContent = ex;
    btn.onclick = () => selectExercise(ex, currentGroup);
    grid.appendChild(btn);
  });
}
renderExercises();

function selectExercise(ex, grp) {
  selectedExercise = ex;
  selectedGroup = grp;
  renderExercises();
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.textContent = `Log ${ex}`;
}

// ---- Optional toggle ----
document.getElementById('optional-toggle').onclick = function() {
  this.classList.toggle('open');
  document.getElementById('optional-fields').classList.toggle('open');
};

// ---- Submit ----
document.getElementById('submit-btn').onclick = async () => {
  const sets = document.getElementById('sets').value;
  const reps = document.getElementById('reps').value;
  const weight = document.getElementById('weight').value;

  if (!selectedExercise) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const now = new Date();
  const payload = {
    date: now.toLocaleDateString('en-US'),
    time: now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}),
    exercise: selectedExercise,
    reps: reps || '',
    sets: sets || '',
    weight: weight || '',
    energy: document.getElementById('energy').value || '',
    bodyweight: document.getElementById('bodyweight').value || '',
    howlong: document.getElementById('howlong').value || '',
  };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    showToast('✓ Logged');
    // Clear numeric fields, keep exercise selected
    ['sets','reps','weight','energy','bodyweight','howlong'].forEach(id => {
      document.getElementById(id).value = '';
    });
  } catch(e) {
    showToast('Connection error — try again');
  }

  btn.disabled = false;
  btn.textContent = `Log ${selectedExercise}`;
};

// ---- Toast ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ---- Nav ----
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    if (btn.dataset.page === 'progress') loadProgress();
  };
});

// ---- Progress ----
async function loadProgress() {
  const el = document.getElementById('progress-content');
  el.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(SCRIPT_URL);
    const rows = await res.json();
    // rows[0] = headers, rows[1+] = data
    // cols: 0=Date, 1=Time, 2=Exercise, 3=Reps, 4=Sets, 5=Weight, 6=Energy, 7=Bodyweight, 8=Howlong
    const data = rows.slice(1).filter(r => r[2]);

    // Group by exercise
    const byEx = {};
    data.forEach(r => {
      const ex = r[2];
      if (!byEx[ex]) byEx[ex] = [];
      byEx[ex].push({
        date: r[0],
        reps: parseFloat(r[3]) || 0,
        sets: parseFloat(r[4]) || 0,
        weight: parseFloat(r[5]) || 0,
        volume: (parseFloat(r[3])||0) * (parseFloat(r[4])||0) * (parseFloat(r[5])||0),
      });
    });

    if (!Object.keys(byEx).length) {
      el.innerHTML = '<div class="empty-state">No workouts logged yet.<br>Hit Log to add your first session.</div>';
      return;
    }

    let html = '';
    // Sort exercises by group order
    const allEx = Object.values(EXERCISES).flat();
    const sorted = allEx.filter(ex => byEx[ex]);

    sorted.forEach(ex => {
      const sessions = byEx[ex];
      const grp = Object.keys(EXERCISES).find(g => EXERCISES[g].includes(ex));
      const last6 = sessions.slice(-6);
      const prev3 = sessions.slice(-6, -3);
      const recent3 = sessions.slice(-3);

      const maxWeight = Math.max(...sessions.map(s => s.weight));
      const lastWeight = sessions[sessions.length-1]?.weight || 0;
      const lastVolume = sessions[sessions.length-1]?.volume || 0;

      const avgVolRecent = recent3.length ? recent3.reduce((a,s) => a + s.volume, 0) / recent3.length : 0;
      const avgVolPrev = prev3.length ? prev3.reduce((a,s) => a + s.volume, 0) / prev3.length : 0;
      const avgWtRecent = recent3.length ? recent3.reduce((a,s) => a + s.weight, 0) / recent3.length : 0;
      const avgWtPrev = prev3.length ? prev3.reduce((a,s) => a + s.weight, 0) / prev3.length : 0;

      const volDown = avgVolRecent < avgVolPrev * 0.97;
      const wtUp = avgWtRecent > avgWtPrev * 1.01;
      const volUp = avgVolRecent > avgVolPrev * 1.01;

      let indicator = '';
      if (volDown && wtUp) {
        indicator = '<span class="indicator strength">↑ Strength gaining — volume shifted for heavier weight</span>';
      } else if (volUp) {
        indicator = '<span class="indicator volume">↑ Volume increasing</span>';
      } else if (sessions.length < 3) {
        indicator = '<span class="indicator neutral">Keep logging to see trends</span>';
      }

      const volumes = last6.map(s => s.volume);
      const canvasId = 'chart-' + ex.replace(/\s+/g, '-');

      html += `
        <div class="exercise-card">
          <div class="card-header">
            <span class="card-name">${ex}</span>
            <span class="card-group" style="background:${GROUP_COLORS[grp]}">${grp}</span>
          </div>
          <div class="card-stats">
            <div class="stat">
              <span class="stat-val">${lastWeight || '—'}</span>
              <span class="stat-label">Last weight</span>
            </div>
            <div class="stat">
              <span class="stat-val">${maxWeight || '—'}</span>
              <span class="stat-label">Max weight</span>
            </div>
            <div class="stat">
              <span class="stat-val">${sessions.length}</span>
              <span class="stat-label">Sessions</span>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="${canvasId}"></canvas>
          </div>
          ${indicator}
        </div>`;
    });

    el.innerHTML = html;

    // Draw sparkline charts
    sorted.forEach(ex => {
      const sessions = byEx[ex];
      const last6 = sessions.slice(-6);
      const volumes = last6.map(s => s.volume);
      const canvasId = 'chart-' + ex.replace(/\s+/g, '-');
      const grp = Object.keys(EXERCISES).find(g => EXERCISES[g].includes(ex));
      drawSparkline(canvasId, volumes, GROUP_COLORS[grp]);
    });

  } catch(e) {
    el.innerHTML = '<div class="empty-state">Couldn\'t load data.<br>Check your connection and try again.</div>';
  }
}

function drawSparkline(canvasId, values, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || values.length < 2) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  const H = 48;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const min = Math.min(...values) * 0.9;
  const max = Math.max(...values) * 1.05;
  const range = max - min || 1;

  const px = (i) => (i / (values.length - 1)) * (W - 16) + 8;
  const py = (v) => H - 8 - ((v - min) / range) * (H - 16);

  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, color + '40');
  grad.addColorStop(1, color + '00');
  ctx.beginPath();
  ctx.moveTo(px(0), py(values[0]));
  values.forEach((v, i) => { if (i > 0) ctx.lineTo(px(i), py(v)); });
  ctx.lineTo(px(values.length-1), H);
  ctx.lineTo(px(0), H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(px(0), py(values[0]));
  values.forEach((v, i) => { if (i > 0) ctx.lineTo(px(i), py(v)); });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dots
  values.forEach((v, i) => {
    ctx.beginPath();
    ctx.arc(px(i), py(v), 3, 0, Math.PI * 2);
    ctx.fillStyle = i === values.length - 1 ? color : color + '80';
    ctx.fill();
  });
}

document.getElementById('refresh-btn').onclick = loadProgress;
</script>
</body>
</html>
