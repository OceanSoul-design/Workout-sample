<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Workout Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #f0f0f0;
    --muted: #6b7280;
    --abs: #D9622B;
    --bicep: #C99A3B;
    --chest: #4a9b6f;
    --shoulders: #5A7A8C;
    --legs: #8C5A7A;
    --back: #5D4A8C;
    --success: #4a9b6f;
    --error: #D9622B;
    --radius: 12px;
  }

  /* PIN screen */
  #pin-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    gap: 32px;
  }
  #pin-screen h2 { font-size: 20px; font-weight: 600; color: var(--text); }
  #pin-screen p { font-size: 13px; color: var(--muted); margin-top: -24px; }
  #pin-status { font-size: 12px; color: var(--error); margin-top: -20px; min-height: 16px; }
  .pin-dots {
    display: flex;
    gap: 16px;
  }
  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: none;
    transition: background .15s, border-color .15s;
  }
  .pin-dot.filled { background: var(--text); border-color: var(--text); }
  .pin-dot.error { background: var(--abs); border-color: var(--abs); }
  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    gap: 12px;
  }
  .pin-btn {
    height: 72px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;
    transition: background .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .pin-btn:active { background: var(--border); }
  .pin-btn.empty { border: none; background: none; cursor: default; }
  .pin-btn.del { font-size: 16px; color: var(--muted); }
  .pin-btn:disabled { opacity: .4; cursor: not-allowed; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Nav */
  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }
  nav button {
    flex: 1;
    padding: 14px 8px 18px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: color .15s;
  }
  nav button.active { color: var(--text); }
  nav button svg { width: 22px; height: 22px; }

  /* Pages */
  .page { display: none; padding: 24px 16px 16px; max-width: 480px; margin: 0 auto; }
  .page.active { display: block; }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  /* Groups */
  .group-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .group-tabs::-webkit-scrollbar { display: none; }
  .group-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .group-tab.active { color: #fff; border-color: transparent; }
  .group-tab[data-group="Abs"].active { background: var(--abs); }
  .group-tab[data-group="Bicep"].active { background: var(--bicep); }
  .group-tab[data-group="Chest"].active { background: var(--chest); }
  .group-tab[data-group="Shoulders"].active { background: var(--shoulders); }
  .group-tab[data-group="Legs"].active { background: var(--legs); }
  .group-tab[data-group="Back"].active { background: var(--back); }

  .profile-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .profile-tab {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .profile-tab.active { background: var(--text); color: var(--bg); border-color: transparent; }

  /* Exercise input */
  .exercise-input-wrap { margin-bottom: 24px; }
  .exercise-input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;
    padding: 14px;
    -webkit-appearance: none;
  }
  .exercise-input-wrap input:focus { outline: none; border-color: #4a4d5a; }

  /* Form fields */
  .fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    padding: 12px;
    width: 100%;
    -webkit-appearance: none;
  }
  .field input:focus { outline: none; border-color: #4a4d5a; }

  /* Optional section */
  .optional-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 16px;
    user-select: none;
  }
  .optional-toggle svg { transition: transform .2s; }
  .optional-toggle.open svg { transform: rotate(90deg); }
  .optional-fields { display: none; }
  .optional-fields.open { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  /* Submit */
  .submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius);
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--success);
    color: #fff;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--error); }

  /* Progress page */
  .progress-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-name { font-size: 14px; font-weight: 600; }
  .card-group {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    color: #fff;
    font-weight: 500;
  }
  .card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--muted); }

  /* Mini chart */
  .chart-wrap { height: 48px; position: relative; }
  canvas { width: 100% !important; height: 48px !important; }

  .indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 8px;
    font-weight: 500;
  }
  .indicator.strength { background: rgba(74,155,111,.15); color: #4a9b6f; }
  .indicator.volume { background: rgba(90,122,140,.15); color: var(--shoulders); }
  .indicator.neutral { background: rgba(107,114,128,.15); color: var(--muted); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .loading { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<!-- LOG PAGE -->
<div class="page active" id="page-log">
  <h1>Log workout</h1>
  <p class="subtitle" id="log-date"></p>

  <div class="profile-tabs" id="profile-tabs"></div>

  <div class="group-tabs" id="group-tabs"></div>

  <div class="exercise-input-wrap">
    <input type="text" id="exercise-input" list="exercise-suggestions" placeholder="Type an exercise..." autocomplete="off">
    <datalist id="exercise-suggestions"></datalist>
  </div>

  <div class="fields">
    <div class="field-row">
      <div class="field">
        <label>Sets</label>
        <input type="number" id="sets" min="1" max="20" placeholder="3">
      </div>
      <div class="field">
        <label>Reps</label>
        <input type="number" id="reps" min="1" max="100" placeholder="10">
      </div>
      <div class="field">
        <label>Weight (lb)</label>
        <input type="number" id="weight" min="0" placeholder="45">
      </div>
    </div>
  </div>

  <div class="optional-toggle" id="optional-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
    Optional — energy, bodyweight, cardio
  </div>
  <div class="optional-fields" id="optional-fields">
    <div class="field-row">
      <div class="field">
        <label>Energy (1–10)</label>
        <input type="number" id="energy" min="1" max="10" placeholder="7">
      </div>
      <div class="field">
        <label>Body weight</label>
        <input type="number" id="bodyweight" placeholder="170">
      </div>
      <div class="field">
        <label>Cardio (min)</label>
        <input type="number" id="howlong" placeholder="20">
      </div>
    </div>
  </div>

  <button class="submit-btn" id="submit-btn" disabled>Enter an exercise</button>
</div>

<!-- PROGRESS PAGE -->
<div class="page" id="page-progress">
  <div class="progress-header">
    <div>
      <h1>Progress</h1>
      <p class="subtitle">Last 6 sessions per exercise</p>
    </div>
    <button class="refresh-btn" id="refresh-btn">Refresh</button>
  </div>
  <div id="progress-content"><div class="loading">Loading...</div></div>
</div>

<!-- NAV -->
<nav>
  <button class="active" data-page="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Log
  </button>
  <button data-page="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Progress
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxG3WY_1gDM6bPh1HMdCikROeb8Z9qeTXW5RLBrnyhBzpRKGKMg3bvPZHxkyx3yBkSq/exec';

function getToken() {
  return sessionStorage.getItem('authToken') || '';
}

// Edit this list to add/remove people. Stored on the device (not
// server-verified) since everyone shares one PIN.
const PROFILES = ['Alex', 'Sam'];

function getCurrentProfile() {
  return localStorage.getItem('profile') || PROFILES[0];
}

function setCurrentProfile(name) {
  localStorage.setItem('profile', name);
}

// Used only to figure out which group old, pre-freeform rows belonged to
// (back when exercises came from a fixed button grid). New rows carry
// their own group, sent along at log time.
const LEGACY_GROUPS = {
  Abs:       ['Cable Crunch', 'Hanging Leg Raise', 'Decline Sit Ups'],
  Bicep:     ['Barbell Curls', 'Incline Curls', 'Preacher Curls'],
  Chest:     ['Bench Press', 'Flat Press Machine', 'Incline Smith Machine', 'Pec Deck', 'Chest Press Machine', 'Push Ups'],
  Shoulders: ['Machine Shoulder Press', 'Cable Lateral Raise', 'Cable Rear Delt Fly'],
  Legs:      ['Leg Spreader Machine', 'Barbell Squats', 'Leg Extensions'],
  Back:      ['Pull Ups'],
};
function legacyGroupFor(name) {
  for (const grp of Object.keys(LEGACY_GROUPS)) {
    if (LEGACY_GROUPS[grp].includes(name)) return grp;
  }
  return null;
}

const GROUP_NAMES = ['Abs', 'Bicep', 'Chest', 'Shoulders', 'Legs', 'Back'];

const GROUP_COLORS = {
  Abs: '#D9622B', Bicep: '#C99A3B', Chest: '#4a9b6f',
  Shoulders: '#5A7A8C', Legs: '#8C5A7A', Back: '#5D4A8C', Other: '#6b7280',
};

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let currentGroup = 'Abs';
let knownExercisesByGroup = {};

// ---- Date subtitle ----
document.getElementById('log-date').textContent =
  new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

// ---- Profile toggle ----
function renderProfileTabs() {
  const el = document.getElementById('profile-tabs');
  el.innerHTML = '';
  const current = getCurrentProfile();
  PROFILES.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'profile-tab' + (name === current ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      setCurrentProfile(name);
      renderProfileTabs();
      loadProgress(); // keep Progress in sync if it's already loaded once
    };
    el.appendChild(btn);
  });
}
renderProfileTabs();

// ---- Build group tabs ----
const groupTabsEl = document.getElementById('group-tabs');
GROUP_NAMES.forEach(grp => {
  const btn = document.createElement('button');
  btn.className = 'group-tab' + (grp === 'Abs' ? ' active' : '');
  btn.dataset.group = grp;
  btn.textContent = grp;
  btn.onclick = () => selectGroup(grp);
  groupTabsEl.appendChild(btn);
});

function selectGroup(grp) {
  currentGroup = grp;
  document.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.group === grp));
  renderExerciseSuggestions();
}

// ---- Autocomplete suggestions, scoped to the active group ----
function renderExerciseSuggestions() {
  const dl = document.getElementById('exercise-suggestions');
  dl.innerHTML = '';
  const names = Array.from(knownExercisesByGroup[currentGroup] || []).sort();
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    dl.appendChild(opt);
  });
}

function indexHistory(rows) {
  const data = rows.slice(1).filter(r => r[2]);
  const map = {};
  data.forEach(r => {
    const name = r[2];
    const grp = r[11] || legacyGroupFor(name) || 'Other';
    if (!map[grp]) map[grp] = new Set();
    map[grp].add(name);
  });
  knownExercisesByGroup = map;
  renderExerciseSuggestions();
}

async function fetchHistory() {
  try {
    const res = await fetch(SCRIPT_URL + '?token=' + encodeURIComponent(getToken()));
    const json = await res.json();
    if (json.ok) indexHistory(json.rows);
    return json;
  } catch (e) {
    return { ok: false };
  }
}

// ---- Exercise name input ----
const exerciseInput = document.getElementById('exercise-input');
exerciseInput.addEventListener('input', () => {
  const val = exerciseInput.value.trim();
  const btn = document.getElementById('submit-btn');
  btn.disabled = !val;
  btn.textContent = val ? `Log ${val}` : 'Enter an exercise';
});
exerciseInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && exerciseInput.value.trim()) {
    e.preventDefault();
    document.getElementById('submit-btn').click();
  }
});

// ---- Optional toggle ----
document.getElementById('optional-toggle').onclick = function() {
  this.classList.toggle('open');
  document.getElementById('optional-fields').classList.toggle('open');
};

// ---- Submit ----
document.getElementById('submit-btn').onclick = async () => {
  const sets = document.getElementById('sets').value;
  const reps = document.getElementById('reps').value;
  const weight = document.getElementById('weight').value;
  const exercise = exerciseInput.value.trim();

  if (!exercise) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const now = new Date();
  const payload = {
    token: getToken(),
    user: getCurrentProfile(),
    date: now.toLocaleDateString('en-US'),
    time: now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}),
    exercise: exercise,
    group: currentGroup,
    reps: reps || '',
    sets: sets || '',
    weight: weight || '',
    energy: document.getElementById('energy').value || '',
    bodyweight: document.getElementById('bodyweight').value || '',
    howlong: document.getElementById('howlong').value || '',
  };

  try {
    // NOTE: mode:'no-cors' means we can't read the response body/status here.
    // If the token were ever wrong, this would silently fail to save — the
    // gate that matters is the PIN check at unlock time (see pin script below).
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    showToast('✓ Logged');
    // Add it to this group's suggestions right away, and clear numeric
    // fields — but keep the exercise name so repeat sets are fast.
    if (!knownExercisesByGroup[currentGroup]) knownExercisesByGroup[currentGroup] = new Set();
    knownExercisesByGroup[currentGroup].add(exercise);
    renderExerciseSuggestions();
    ['sets','reps','weight','energy','bodyweight','howlong'].forEach(id => {
      document.getElementById(id).value = '';
    });
  } catch(e) {
    showToast('Connection error — try again', true);
  }

  btn.disabled = false;
  btn.textContent = `Log ${exercise}`;
};

// ---- Toast ----
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ---- Nav ----
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    if (btn.dataset.page === 'progress') loadProgress();
  };
});

// ---- Progress ----
async function loadProgress() {
  const el = document.getElementById('progress-content');
  el.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(SCRIPT_URL + '?token=' + encodeURIComponent(getToken()));
    const json = await res.json();

    if (!json.ok) {
      el.innerHTML = '<div class="empty-state">Session expired or unauthorized.<br>Reload the page to sign in again.</div>';
      sessionStorage.removeItem('authToken');
      return;
    }

    const rows = json.rows;
    // rows[0] = headers, rows[1+] = data
    // cols: 0=Date, 1=Time, 2=Type, 3=Reps, 4=Sets, 5=Weight, 6=Energy,
    //       7=Body Weight, 8=How Long, 9=Volume, 10=User, 11=Group
    indexHistory(rows); // keep Log page's autocomplete fresh too
    const activeProfile = getCurrentProfile();
    const data = rows.slice(1).filter(r => r[2] && r[10] === activeProfile);

    // Group by exercise
    const byEx = {};
    data.forEach(r => {
      const ex = r[2];
      const grp = r[11] || legacyGroupFor(ex) || 'Other';
      if (!byEx[ex]) byEx[ex] = { group: grp, sessions: [] };
      byEx[ex].sessions.push({
        date: r[0],
        reps: parseFloat(r[3]) || 0,
        sets: parseFloat(r[4]) || 0,
        weight: parseFloat(r[5]) || 0,
        volume: parseFloat(r[9]) || ((parseFloat(r[3])||0) * (parseFloat(r[4])||0) * (parseFloat(r[5])||0)),
      });
    });

    if (!Object.keys(byEx).length) {
      el.innerHTML = '<div class="empty-state">No workouts logged yet.<br>Hit Log to add your first session.</div>';
      return;
    }

    let html = '';
    // Sort by group (in a fixed order), then alphabetically within group
    const GROUP_ORDER = ['Abs', 'Bicep', 'Chest', 'Shoulders', 'Legs', 'Back', 'Other'];
    const sorted = Object.keys(byEx).sort((a, b) => {
      const ia = GROUP_ORDER.indexOf(byEx[a].group);
      const ib = GROUP_ORDER.indexOf(byEx[b].group);
      const oa = ia === -1 ? 999 : ia;
      const ob = ib === -1 ? 999 : ib;
      return oa !== ob ? oa - ob : a.localeCompare(b);
    });

    sorted.forEach(ex => {
      const sessions = byEx[ex].sessions;
      const grp = byEx[ex].group;
      const last6 = sessions.slice(-6);
      const prev3 = sessions.slice(-6, -3);
      const recent3 = sessions.slice(-3);

      const maxWeight = Math.max(...sessions.map(s => s.weight));
      const lastWeight = sessions[sessions.length-1]?.weight || 0;
      const lastVolume = sessions[sessions.length-1]?.volume || 0;

      const avgVolRecent = recent3.length ? recent3.reduce((a,s) => a + s.volume, 0) / recent3.length : 0;
      const avgVolPrev = prev3.length ? prev3.reduce((a,s) => a + s.volume, 0) / prev3.length : 0;
      const avgWtRecent = recent3.length ? recent3.reduce((a,s) => a + s.weight, 0) / recent3.length : 0;
      const avgWtPrev = prev3.length ? prev3.reduce((a,s) => a + s.weight, 0) / prev3.length : 0;

      const volDown = avgVolRecent < avgVolPrev * 0.97;
      const wtUp = avgWtRecent > avgWtPrev * 1.01;
      const volUp = avgVolRecent > avgVolPrev * 1.01;

      let indicator = '';
      if (volDown && wtUp) {
        indicator = '<span class="indicator strength">↑ Strength gaining — volume shifted for heavier weight</span>';
      } else if (volUp) {
        indicator = '<span class="indicator volume">↑ Volume increasing</span>';
      } else if (sessions.length < 3) {
        indicator = '<span class="indicator neutral">Keep logging to see trends</span>';
      }

      const volumes = last6.map(s => s.volume);
      const canvasId = 'chart-' + ex.replace(/\s+/g, '-');

      html += `
        <div class="exercise-card">
          <div class="card-header">
            <span class="card-name">${escapeHtml(ex)}</span>
            <span class="card-group" style="background:${GROUP_COLORS[grp]}">${grp}</span>
          </div>
          <div class="card-stats">
            <div class="stat">
              <span class="stat-val">${lastWeight || '—'}</span>
              <span class="stat-label">Last weight</span>
            </div>
            <div class="stat">
              <span class="stat-val">${maxWeight || '—'}</span>
              <span class="stat-label">Max weight</span>
            </div>
            <div class="stat">
              <span class="stat-val">${sessions.length}</span>
              <span class="stat-label">Sessions</span>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="${canvasId}"></canvas>
          </div>
          ${indicator}
        </div>`;
    });

    el.innerHTML = html;

    // Draw sparkline charts
    sorted.forEach(ex => {
      const sessions = byEx[ex].sessions;
      const last6 = sessions.slice(-6);
      const volumes = last6.map(s => s.volume);
      const canvasId = 'chart-' + ex.replace(/\s+/g, '-');
      const grp = byEx[ex].group;
      drawSparkline(canvasId, volumes, GROUP_COLORS[grp]);
    });

  } catch(e) {
    el.innerHTML = '<div class="empty-state">Couldn\'t load data.<br>Check your connection and try again.</div>';
  }
}

function drawSparkline(canvasId, values, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || values.length < 2) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  const H = 48;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const min = Math.min(...values) * 0.9;
  const max = Math.max(...values) * 1.05;
  const range = max - min || 1;

  const px = (i) => (i / (values.length - 1)) * (W - 16) + 8;
  const py = (v) => H - 8 - ((v - min) / range) * (H - 16);

  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, color + '40');
  grad.addColorStop(1, color + '00');
  ctx.beginPath();
  ctx.moveTo(px(0), py(values[0]));
  values.forEach((v, i) => { if (i > 0) ctx.lineTo(px(i), py(v)); });
  ctx.lineTo(px(values.length-1), H);
  ctx.lineTo(px(0), H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(px(0), py(values[0]));
  values.forEach((v, i) => { if (i > 0) ctx.lineTo(px(i), py(v)); });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dots
  values.forEach((v, i) => {
    ctx.beginPath();
    ctx.arc(px(i), py(v), 3, 0, Math.PI * 2);
    ctx.fillStyle = i === values.length - 1 ? color : color + '80';
    ctx.fill();
  });
}

document.getElementById('refresh-btn').onclick = loadProgress;
</script>
<!-- PIN SCREEN -->
<div id="pin-screen">
  <h2>Workout Log</h2>
  <p>Enter PIN to continue</p>
  <p id="pin-status"></p>
  <div class="pin-dots">
    <div class="pin-dot" id="dot-0"></div>
    <div class="pin-dot" id="dot-1"></div>
    <div class="pin-dot" id="dot-2"></div>
    <div class="pin-dot" id="dot-3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn empty"></button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn del" onclick="pinDelete()">⌫</button>
  </div>
</div>

<script>
// The correct PIN is NOT stored here anymore — it lives only in the
// Apps Script's Script Properties (server-side) and is verified over
// the network. Reading this file's source no longer reveals it.

let pinEntry = '';
let checking = false;

if (sessionStorage.getItem('authToken')) {
  document.getElementById('pin-screen').style.display = 'none';
  fetchHistory();
}

function setPadDisabled(disabled) {
  document.querySelectorAll('.pin-btn:not(.empty)').forEach(b => b.disabled = disabled);
}

function pinPress(digit) {
  if (checking || pinEntry.length >= 4) return;
  pinEntry += digit;
  updateDots();
  if (pinEntry.length === 4) checkPin();
}

function pinDelete() {
  if (checking) return;
  pinEntry = pinEntry.slice(0, -1);
  updateDots();
}

function updateDots(error = false) {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot-' + i);
    dot.classList.toggle('filled', i < pinEntry.length && !error);
    dot.classList.toggle('error', error);
  }
}

async function checkPin() {
  const attempted = pinEntry;
  checking = true;
  setPadDisabled(true);
  document.getElementById('pin-status').textContent = '';

  try {
    const url = SCRIPT_URL + '?token=' + encodeURIComponent(attempted) + '&action=ping';
    const res = await fetch(url);
    const data = await res.json();

    if (data.ok) {
      sessionStorage.setItem('authToken', attempted);
      document.getElementById('pin-screen').style.display = 'none';
      fetchHistory();
      checking = false;
      return;
    }

    if (data.error === 'locked_out') {
      document.getElementById('pin-status').textContent = 'Too many attempts — try again in a few minutes.';
    }
  } catch (e) {
    document.getElementById('pin-status').textContent = 'Connection error — check your network.';
  }

  updateDots(true);
  setTimeout(() => {
    pinEntry = '';
    updateDots();
    setPadDisabled(false);
    checking = false;
  }, 600);
}
</script>
